# GPU override. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  backend:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
